<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background-image: url('karam_welcome.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
      position: relative;
    }

    /* Logo top-centered */
    .site-logo {
      position: absolute;
      top: 3px;
      left: 50%;
      transform: translateX(-50%);
    }

    .site-logo img {
      max-width: 160px;
      /* Glow effect */
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.6))
              drop-shadow(0 0 20px rgba(255, 255, 255, 0.4));
    }

    /* Centered content */
    .container {
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .contact-box {
      background: rgba(0, 0, 0, 0.5);
      padding: 30px 40px;
      border-radius: 15px;
    }

    a {
      color: #ffd700;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <!-- Logo -->
  <div class="site-logo">
    <img src="14_nobg.png" alt="Logo">
  </div>

  <!-- Contact Box -->
  <div class="container">
    <div class="contact-box">
      <h1>Contact Me</h1>
      <p>Email me at:</p>
      <p><a href="mailto:skkxy3@gmail.com">skkxy3@gmail.com</a></p>
    </div>
  </div>

</body>
</html>
