<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    /* Make the image cover the whole background */
    body {
      margin: 0;
      height: 100vh;
      background-image: url('karam_welcome.jpg'); /* Use your image filename */
      background-size: cover;       /* Cover entire screen */
      background-position: center;  /* Center the image */
      background-repeat: no-repeat; /* Don't tile */
      font-family: Arial, sans-serif;
      color: white;                 /* Text color on top of image */
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    h1 {
      font-size: 3em;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.7); /* Makes text readable on image */
    }

    p {
      font-size: 1.5em;
      text-shadow: 1px 1px 5px rgba(0,0,0,0.7);
    }
  </style>
</head>
<body>

</body>
</html>
